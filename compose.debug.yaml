services:
  expensetracker:
    image: expense-tracker
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - configuration=Debug
    ports:
      - 5068:5068
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5068
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
